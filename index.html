      property="og:description"
      content="A free interactive 3D atlas of the human body. Rotate, zoom, and explore every organ and body system, then learn with guided lessons and quizzes."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["WebApplication", "LearningResource"],
        "name": "Anatomy Atlas",
        "url": "https://anatomy-atlas-b2m.pages.dev/",
        "description": "A free interactive 3D atlas of the human body with guided lessons, organ entries, and quizzes.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (runs in a web browser with WebGL)",
        "browserRequirements": "Requires JavaScript and WebGL",
        "isAccessibleForFree": true,
        "educationalLevel": "Beginner to intermediate",
        "about": { "@type": "AnatomicalSystem", "name": "Human anatomy" },
        "image": "https://anatomy-atlas-b2m.pages.dev/og.png"
      }
    </script>
    <style>
      html { background: #f4eee3; }
      #root { min-height: 100vh; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4eee3; z-index: 9999; transition: opacity .4s ease; }
      .boot--done { opacity: 0; }
      .boot__mark { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #1e1b17; position: relative; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot__mark::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #a63d2f; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.12); opacity: .55 } }
      @media (prefers-reduced-motion: reduce) { .boot__mark { animation: none } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot" id="boot"><div class="boot__mark" aria-hidden="true"></div></div>
    <noscript>
      <div style="padding: 48px; font-family: Georgia, serif; max-width: 640px; margin: 0 auto">
        <h1>Anatomy Atlas</h1>
        <p>This interactive 3D atlas needs JavaScript enabled. Please enable JavaScript to explore the human body.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
